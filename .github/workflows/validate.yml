name: validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test source patch tool
        run: python3 -m unittest discover -s tests -v
      - name: Verify bundled patch integrity
        run: python3 tools/patch_component.py --validate
